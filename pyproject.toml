[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flisr"
version = "0.1.0"
description = "Distribution-network fault isolation and service restoration (FLISR) on pandapower networks: isolate a faulted section, then restore load by closing tie switches, one power-flow-checked step at a time"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandapower>=3.0",
    "scipy",
]
authors = [{ name = "ChenYi-Nnergy" }]
keywords = ["distribution-network", "FLISR", "fault-isolation", "service-restoration", "pandapower", "radial", "load-priority"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
flisr = "flisr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "D203", "D213"]
